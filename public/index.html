<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collector's Canyon | Pokemon Card Deals</title>
  <meta name="description" content="Discover rare Pokemon card deals. Expert grading, curated collections.">
  
  <style>
    :root {
      --minScale: .94;
      --maxScale: 1.10;
      /* Canyon Desert Theme */
      --bg: #1a1410;
      --bg-warm: #2d1f14;
      --bg-card: #3a2819;
      --text: #f5e6d3;
      --text-muted: #a89080;
      --accent: #e07b39;
      --accent-glow: #ff9f43;
      --accent-dark: #c45c1a;
      --success: #52c41a;
      --warning: #faad14;
      --danger: #ff4d4f;
      --border: #5a4030;
      --sand: #d4a574;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #0f0a08 100%);
      color: var(--text);
      min-height: 100vh;
    }
    
    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, var(--bg-warm) 0%, var(--bg) 100%);
      padding: 60px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(224,123,57,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    
    .hero h1 {
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--text) 0%, var(--sand) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .hero .tagline {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto;
    }
    
    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 24px 20px;
      background: var(--bg-warm);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* Watchlist Section */
    .watchlist-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 16px 80px;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--sand);
    }
    
    /* Card Grid */
    .grid { display: grid; gap: 16px; }
    
    .card {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 16px;
      padding: 16px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transform: translateZ(0) scale(var(--minScale));
      transition: all 220ms ease;
      will-change: transform;
    }
    
    .card:hover {
      border-color: var(--accent);
    }
    
    .card.is-focused {
      background: linear-gradient(135deg, var(--bg-card) 0%, #4a3020 100%);
      border-color: var(--accent);
      box-shadow: 0 12px 40px rgba(224,123,57,0.2), 0 8px 24px rgba(0,0,0,0.4);
    }
    
    .thumb {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .thumb-placeholder {
      font-size: 32px;
      opacity: 0.3;
    }
    
    .meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    
    .meta .title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .meta .details {
      font-size: 13px;
      color: var(--text-muted);
    }
    
    .meta .badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--bg);
      color: var(--sand);
      margin-top: 8px;
      width: fit-content;
    }
    
    .price-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      text-align: right;
      min-width: 90px;
    }
    
    .price-col .list-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    
    .price-col .pc-price {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    
    .price-col .edge {
      font-size: 14px;
      font-weight: 700;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 6px;
    }
    
    .edge.ready {
      background: rgba(82,196,26,0.2);
      color: var(--success);
    }
    
    .edge.review {
      background: rgba(250,173,20,0.2);
      color: var(--warning);
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-size: 16px;
    }
    
    /* Empty State */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
      border-top: 1px solid var(--border);
    }
    
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    
    @media (max-width: 600px) {
      .card {
        grid-template-columns: 80px 1fr;
        grid-template-rows: auto auto;
      }
      .thumb { width: 80px; height: 80px; }
      .price-col {
        grid-column: 2;
        flex-direction: row;
        justify-content: flex-start;
        gap: 12px;
        align-items: center;
        margin-top: 8px;
      }
      .stats-bar { gap: 20px; }
      .stat-value { font-size: 22px; }
    }
  </style>
</head>
<body>
  
  <header class="hero">
    <h1>Collector's Canyon</h1>
    <p class="tagline">Rare Pokemon cards. Expert grading. Curated for collectors.</p>
  </header>
  
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="stat-watched">-</div>
      <div class="stat-label">Cards Watched</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-ready">-</div>
      <div class="stat-label">Ready to Buy</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-review">-</div>
      <div class="stat-label">Under Review</div>
    </div>
  </div>
  
  <section class="watchlist-section">
    <div class="section-header">
      <h2 class="section-title">🔥 Live Watchlist</h2>
    </div>
    <div id="list" class="grid">
      <div class="loading">Loading cards...</div>
    </div>
  </section>
  
  <footer>
    <p>© 2026 Collector's Canyon</p>
  </footer>

  <script>
    const API_BASE = window.PUBLIC_API_BASE || '';
    const endpoint = `${API_BASE}/api/public/watchlist`;
    
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    
    async function loadWatchlist() {
      const res = await fetch(endpoint, { cache: "no-store" });
      const data = await res.json();
      return data.watchlist || [];
    }
    
    function formatPct(n) {
      if (n === null || n === undefined || Number.isNaN(Number(n))) return "—";
      const v = Number(n);
      return `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`;
    }
    
    function render(items) {
      const list = document.getElementById("list");
      
      if (!items || items.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🏜️</div>
            <p>No cards in the canyon right now.<br>Check back soon!</p>
          </div>
        `;
        return;
      }
      
      list.innerHTML = items.map((it, idx) => {
        const bucketClass = it.bucket === 'READY' ? 'ready' : 'review';
        const hasImage = it.imageUrl;
        
        return `
          <div class="card" data-idx="${idx}">
            <div class="thumb">
              ${hasImage 
                ? `<img loading="lazy" src="${it.imageUrl}" alt="" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='<span class=\\'thumb-placeholder\\'>🎴</span>'">`
                : `<span class="thumb-placeholder">🎴</span>`
              }
            </div>
            <div class="meta">
              <div class="title">${it.title || "Unknown Card"}</div>
              <div class="details">${[it.set, it.grade].filter(Boolean).join(" • ")}</div>
              ${it.bucket ? `<span class="badge">${it.bucket}</span>` : ''}
            </div>
            <div class="price-col">
              <div class="list-price">$${Number(it.price||0).toFixed(2)}</div>
              <div class="pc-price">PC: $${Number(it.pcPrice||0).toFixed(2)}</div>
              <div class="edge ${bucketClass}">${formatPct(it.edgePct)}</div>
            </div>
          </div>
        `;
      }).join("");
      
      attachCenterScale();
      updateStats(items);
    }
    
    function updateStats(items) {
      const ready = items.filter(i => i.bucket === 'READY').length;
      const review = items.filter(i => i.bucket === 'REVIEW').length;
      document.getElementById('stat-watched').textContent = items.length;
      document.getElementById('stat-ready').textContent = ready;
      document.getElementById('stat-review').textContent = review;
    }
    
    function attachCenterScale() {
      const cards = Array.from(document.querySelectorAll(".card"));
      if (!cards.length) return;
      
      let ticking = false;
      const inView = new Set();
      
      const io = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) inView.add(e.target);
          else inView.delete(e.target);
        }
        requestTick();
      }, { root: null, threshold: 0, rootMargin: "200px 0px 200px 0px" });
      
      cards.forEach(c => io.observe(c));
      
      function requestTick() {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }
      
      function update() {
        ticking = false;
        const vh = window.innerHeight;
        const centerY = vh / 2;
        
        for (const el of inView) {
          const r = el.getBoundingClientRect();
          const elCenter = r.top + r.height / 2;
          const dist = Math.abs(elCenter - centerY);
          
          const norm = clamp(dist / (vh * 0.55), 0, 1);
          const scale = (1 - norm) * 1.10 + norm * 0.94;
          el.style.transform = `translateZ(0) scale(${scale.toFixed(3)})`;
        }
        
        // Find best (closest to center)
        let best = null;
        let bestDist = Infinity;
        for (const el of inView) {
          const r = el.getBoundingClientRect();
          const elCenter = r.top + r.height / 2;
          const dist = Math.abs(elCenter - centerY);
          if (dist < bestDist) { bestDist = dist; best = el; }
        }
        
        cards.forEach(c => c.classList.toggle("is-focused", c === best));
      }
      
      window.addEventListener("scroll", requestTick, { passive: true });
      window.addEventListener("resize", requestTick);
      requestTick();
    }
    
    (async function init() {
      try {
        const items = await loadWatchlist();
        render(items);
      } catch (e) {
        document.getElementById('list').innerHTML = `
          <div class="empty">
            <div class="empty-icon">🏜️</div>
            <p>Unable to load watchlist.<br>Please try again later.</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
