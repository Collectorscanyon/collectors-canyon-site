name: Daily Freshness Check

on:
  workflow_dispatch:
  schedule:
    # Daily at 13:17 UTC. Keeps public data and build output fresh for review.
    - cron: '17 13 * * *'

permissions:
  contents: read

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh public API from in-repo data
        run: npm run freshness

      - name: Build site locally
        run: npm run build

      - name: Upload refreshed API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-public-api
          path: public/api/*.json
          if-no-files-found: error

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
